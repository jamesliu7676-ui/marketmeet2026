// ====== FORCE-DIRECTED GRAPH ======
function initGraph(containerId, r) {
  const c = document.getElementById(containerId);
  if (!c || !r || !r.members) return;
  const W = 800, H = 480;
  let nodes = [], edges = [], idCounter = 0;
  const addNode = (label, type, ref) => { const n = { id:++idCounter, label, type, ref, x:Math.random()*W*0.6+W*0.2, y:Math.random()*H*0.4+H*0.1, vx:0, vy:0, fixed:false }; nodes.push(n); return n; };
  const addEdge = (a, b) => { edges.push({a,b}); };
  const root = addNode(r.me, 'company', r.me);
  r.members.forEach(p => {
    const pn = addNode(p.name+' '+p.role, 'person', p.name);
    addEdge(root, pn);
    p.companies.forEach(cn => {
      if (cn === r.me) return;
      let cnNode = nodes.find(n => n.type==='company' && n.ref===cn);
      if (!cnNode) cnNode = addNode(cn, 'company-sub', cn);
      addEdge(pn, cnNode);
    });
  });

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.style.display='block'; svg.style.cursor='grab';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML='<filter id="sg"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.25"/></filter>';
  svg.appendChild(defs);

  const edgeG = document.createElementNS('http://www.w3.org/2000/svg','g');
  const edgeEls = [];
  edges.forEach(()=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('stroke','#90caf9');l.setAttribute('stroke-width','1.2');l.setAttribute('stroke-dasharray','3,2');edgeG.appendChild(l);edgeEls.push(l);});
  svg.appendChild(edgeG);

  const nodeG = document.createElementNS('http://www.w3.org/2000/svg','g');
  const nodeEls = nodes.map(n => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g'); g.style.cursor='move';
    const rw = Math.max(80, Math.min(200, n.label.length*10+24));
    let fill,stroke,tFill,tSize;
    if (n.type==='company'){fill='#e3f2fd';stroke='#1565c0';tFill='#1565c0';tSize=15;}
    else if(n.type==='person'){fill='#fff176';stroke='#f9a825';tFill='#6d4c00';tSize=14;}
    else{fill='#eeeeee';stroke='#9e9e9e';tFill='#616161';tSize=13;}
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',-rw/2);rect.setAttribute('y',-16);rect.setAttribute('width',rw);rect.setAttribute('height',32);
    rect.setAttribute('rx',6);rect.setAttribute('fill',fill);rect.setAttribute('stroke',stroke);rect.setAttribute('stroke-width','1.2');rect.setAttribute('filter','url(#sg)');
    g.appendChild(rect);
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','central');
    text.setAttribute('font-size',tSize);text.setAttribute('fill',tFill);text.setAttribute('font-weight','600');
    text.textContent=n.label;g.appendChild(text);g.dataset.id=n.id;nodeG.appendChild(g);return g;
  });
  svg.appendChild(nodeG);

  let dragNode=null, dragOffX, dragOffY;
  function getMousePos(e){const r=svg.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
  function onDown(e){const g=e.target.closest('g[data-id]');if(!g)return;const n=nodes.find(x=>x.id==g.dataset.id);if(!n)return;e.preventDefault();dragNode=n;n.fixed=true;const p=getMousePos(e);dragOffX=p.x-n.x;dragOffY=p.y-n.y;svg.style.cursor='grabbing';}
  function onMove(e){if(!dragNode)return;e.preventDefault();const p=getMousePos(e);dragNode.x=p.x-dragOffX;dragNode.y=p.y-dragOffY;}
  function onUp(){dragNode=null;svg.style.cursor='grab';}
  svg.addEventListener('mousedown',onDown);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
  svg.addEventListener('touchstart',onDown,{passive:false});document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);

  let anim;
  function simulate(){
    const rep=5000,att=0.002,damp=0.85,grav=0.005;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];if(a.fixed)continue;
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y;let d=Math.sqrt(dx*dx+dy*dy)||1;let f=rep/(d*d);a.vx+=(dx/d)*f;a.vy+=(dy/d)*f;b.vx-=(dx/d)*f;b.vy-=(dy/d)*f;}
      a.vx+=(W/2-a.x)*grav;a.vy+=(H/2-a.y)*grav;}
    edges.forEach(e=>{const a=nodes.find(n=>n.id===e.a.id);const b=nodes.find(n=>n.id===e.b.id);if(!a||!b)return;if(a.fixed&&b.fixed)return;let dx=b.x-a.x,dy=b.y-a.y;let d=Math.sqrt(dx*dx+dy*dy)||1;let f=(d-80)*att;if(!a.fixed){a.vx+=(dx/d)*f;a.vy+=(dy/d)*f;}if(!b.fixed){b.vx-=(dx/d)*f;b.vy-=(dy/d)*f;}});
    let energy=0;
    nodes.forEach(n=>{if(n.fixed)return;n.vx*=damp;n.vy*=damp;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(20,Math.min(W-20,n.x));n.y=Math.max(20,Math.min(H-20,n.y));energy+=Math.abs(n.vx)+Math.abs(n.vy);});
    render();if(energy>0.5)anim=requestAnimationFrame(simulate);else anim=null;
  }
  function render(){nodeEls.forEach((g,i)=>{g.setAttribute('transform',`translate(${nodes[i].x},${nodes[i].y})`);});edgeEls.forEach((line,i)=>{const e=edges[i];const a=nodes.find(n=>n.id===e.a.id);const b=nodes.find(n=>n.id===e.b.id);if(a&&b){line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);}});}
  c.innerHTML='';c.appendChild(svg);
  nodes.forEach(n=>{n.vx+=(Math.random()-0.5)*4;n.vy+=(Math.random()-0.5)*4;});
  simulate();
  return ()=>{if(anim)cancelAnimationFrame(anim);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);};
}

// ====== MAP RENDERING ======
let currentRegion = 'all';
let markerLayer = L.layerGroup().addTo(map);
let graphCleanups = {};

function loadRegion(regionKey) {
  while(markerLayer.getLayers().length) markerLayer.removeLayer(markerLayer.getLayers()[0]);
  Object.keys(graphCleanups).forEach(k=>{if(graphCleanups[k]){try{graphCleanups[k]();}catch(e){}delete graphCleanups[k];}});

  let data = regions[regionKey];
  // Build 'all' on the fly from all non-placeholder markers
  if (regionKey === 'all') {
    const allM = [];
    Object.keys(regions).forEach(k => regions[k].markers.forEach(m => { if (m.group !== '1star') allM.push(m); }));
    data = { label:'?典璁汗 繚 撌脣?????, center:[23.8,121.0], zoom:8, markers:allM };
  }
  document.getElementById('regionInfo').textContent = data.label + ' 繚 ' + data.markers.length + ' ??暺?;

  data.markers.forEach((m, idx) => {
    const color = colors[m.group] || '#95a5a6';
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:26px;height:26px;border-radius:50%;background:${color};border:4px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.6)"></div>`,
      iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-16]
    });
    const marker = L.marker([m.lat, m.lng], {icon}).addTo(markerLayer);
    marker.bindTooltip(m.name, {direction:'top', offset:[0,-6], opacity:0.95});

    let popupHtml = `<div class="popup-content" style="width:800px;max-height:560px;overflow-y:auto">
      <div class="name">${m.name}</div>
      <div class="detail">${m.addr}</div>
      <div class="detail">${m.detail}</div>`;
    if (m.specs) popupHtml += `<div class="p-specs">${m.specs}</div>`;
    if (m.relations) {
      popupHtml += `<div class="rel-title">??鈭?靽?霅?<span style="font-weight:400;font-size:10px;color:#999">嚗?蝭暺?</span></div>
        <div class="rel-graph"><div id="g_${regionKey}_${idx}" style="width:800px;height:480px"></div></div>`;
    }
    popupHtml += `</div>`;
    marker.bindPopup(popupHtml, {maxWidth:820, maxHeight:600});

    if (m.relations) {
      let cleanup;
      marker.on('popupopen', () => {
        if (cleanup) cleanup();
        setTimeout(() => {
          cleanup = initGraph('g_'+regionKey+'_'+idx, m.relations);
          graphCleanups[regionKey+'_'+idx] = cleanup;
        }, 50);
      });
      marker.on('popupclose', () => {
        if (cleanup) { cleanup(); cleanup = null; delete graphCleanups[regionKey+'_'+idx]; }
      });
    }
  });

  if (data.markers.length) {
    const group = L.featureGroup(data.markers.map(m => L.marker([m.lat, m.lng])));
    map.fitBounds(group.getBounds().pad(0.08));
  } else {
    map.setView(data.center, data.zoom);
  }
}

// ====== LEGEND ======
const legend = L.control({position:'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div','legend');
  div.innerHTML='<h4>閬芋??</h4>';
  Object.keys(scaleLabels).forEach(k=>{
    div.innerHTML+=`<div class="row"><i style="background:${colors[k]}"></i> ${scaleLabels[k]}</div>`;
  });
  div.innerHTML+=`<hr style="margin:6px 0"><div style="font-size:12px;color:#888">? ?豢筑憿舐內撱? 嚚?暺??亦?閰喟敦</div>`;
  return div;
};

// ====== REGION SWITCH ======
document.getElementById('regionSelect').addEventListener('change', function() {
  currentRegion = this.value;
  loadRegion(currentRegion);
});

loadRegion('all');
legend.addTo(map);
</script>

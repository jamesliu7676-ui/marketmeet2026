          const ocy = y - 2 + ci * 24;
          if (ci === 0) svgLines += `<line x1="110" y1="${y}" x2="${ocx - 6}" y2="${ocy}" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="2,2"/>`;
          const tw = Math.min(130, Math.max(40, c.length * 7 + 10));
          svgNodes += `<rect x="${ocx - tw/2}" y="${ocy - 8}" width="${tw}" height="16" rx="3" fill="#fafafa" stroke="#bdbdbd" stroke-width="0.6"/>`;
          svgNodes += `<text x="${ocx}" y="${ocy + 4}" text-anchor="middle" font-size="8" fill="#616161">${c}</text>`;
        });

        y += Math.max(1, otherCos.length) * 24 + 6;
      });

      const svgH = y + 14;
      popupHtml += `<div class="rel-graph"><svg width="${svgW}" height="${svgH}">${svgLines}${svgNodes}</svg></div>`;
    });
  }

  popupHtml += `</div>`;
  marker.bindPopup(popupHtml);
});

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<h4>閬芋??</h4>';
  Object.keys(scaleLabels).forEach(k => {
    div.innerHTML += `<div class="row"><i style="background:${colors[k]}"></i> ${scaleLabels[k]}</div>`;
  });
  div.innerHTML += `<hr style="margin:6px 0"><div style="font-size:12px;color:#888">? ?豢筑憿舐內撱? 嚚?暺??亦?閰喟敦</div>`;
  return div;
};
legend.addTo(map);

// Fit bounds
const group = L.featureGroup(markers.map(m => L.marker([m.lat, m.lng])));
map.fitBounds(group.getBounds().pad(0.08));
</script>
